<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>千枝物語改進清單</title>
<style>
:root {
  --bg: #f6f5f2; --card: #ffffff; --text: #1f1d1a; --muted: #6b665e; --line: #e2ded6;
  --accent: #2f6f5e; --accent-soft: #e3f0ec; --hi: #b4442f; --mid: #a87412; --lo: #5c6b7a;
  --chip: #efece6; --chip-on: #2f6f5e; --chip-on-text: #ffffff; --done: #f1f7f4;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161714; --card: #1f201c; --text: #ebe8e1; --muted: #a39e94; --line: #34352f;
    --accent: #6cc0a5; --accent-soft: #1f3530; --hi: #ef8a73; --mid: #e0b14f; --lo: #9fb0c0;
    --chip: #2a2b26; --chip-on: #6cc0a5; --chip-on-text: #10201b; --done: #1c2a25;
  }
}
:root[data-theme="dark"] {
  --bg: #161714; --card: #1f201c; --text: #ebe8e1; --muted: #a39e94; --line: #34352f;
  --accent: #6cc0a5; --accent-soft: #1f3530; --hi: #ef8a73; --mid: #e0b14f; --lo: #9fb0c0;
  --chip: #2a2b26; --chip-on: #6cc0a5; --chip-on-text: #10201b; --done: #1c2a25;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.6 "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
}
.wrap { max-width: 980px; margin: 0 auto; padding: 0 16px 120px; }
header { padding: 28px 0 8px; }
h1 { font-size: 24px; margin: 0 0 6px; }
.lead { color: var(--muted); margin: 0 0 4px; }
.bar {
  position: sticky; top: 0; z-index: 5; background: var(--bg);
  padding: 10px 0; border-bottom: 1px solid var(--line);
}
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 6px 0; }
input[type="search"], select, textarea {
  font: inherit; color: var(--text); background: var(--card);
  border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px;
}
input[type="search"] { flex: 1 1 220px; min-width: 0; }
button {
  font: inherit; cursor: pointer; border-radius: 8px; padding: 7px 12px;
  border: 1px solid var(--line); background: var(--card); color: var(--text);
}
button.primary { background: var(--accent); border-color: var(--accent); color: var(--chip-on-text); font-weight: 600; }
.chip { background: var(--chip); border-color: transparent; padding: 5px 10px; font-size: 13px; }
.chip.on { background: var(--chip-on); color: var(--chip-on-text); }
.count { font-weight: 600; color: var(--accent); margin-left: auto; white-space: nowrap; }
.cat-title { font-size: 17px; margin: 26px 0 8px; display: flex; gap: 8px; align-items: baseline; }
.cat-title small { color: var(--muted); font-weight: 400; font-size: 13px; }
.item {
  display: grid; grid-template-columns: 28px 1fr; gap: 6px 10px;
  background: var(--card); border: 1px solid var(--line); border-radius: 10px;
  padding: 12px 14px; margin: 8px 0; cursor: pointer;
}
.item.checked { background: var(--done); border-color: var(--accent); }
.item input { width: 20px; height: 20px; margin: 3px 0 0; accent-color: var(--accent); cursor: pointer; }
.head { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; }
.id { font-family: ui-monospace, Consolas, monospace; color: var(--muted); font-size: 13px; }
.title { font-weight: 600; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.tag { font-size: 12px; padding: 1px 8px; border-radius: 99px; background: var(--chip); color: var(--muted); }
.tag.hi { color: var(--hi); } .tag.mid { color: var(--mid); } .tag.lo { color: var(--lo); }
.tag.pick { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.desc { grid-column: 2; font-size: 14px; }
.desc p { margin: 3px 0; }
.desc b { color: var(--muted); font-weight: 600; }
.files { font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: var(--muted); word-break: break-all; }
.legend { font-size: 13px; color: var(--muted); }
.empty { text-align: center; color: var(--muted); padding: 40px 0; }
.out {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  background: var(--card); border-top: 1px solid var(--line); box-shadow: 0 -4px 16px rgba(0,0,0,.08);
}
.out .wrap { padding-bottom: 12px; padding-top: 10px; }
.out textarea { width: 100%; min-height: 56px; resize: vertical; }
.out .out-preview { display: none; width: 100%; min-height: 140px; margin-top: 8px; font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
.out .out-preview.show { display: block; }
.msg { font-size: 13px; color: var(--accent); }
@media (max-height: 760px) {
  .bar { position: static; }
  .out textarea#note { min-height: 38px; }
}
@media (max-width: 600px) {
  h1 { font-size: 20px; }
  .bar { position: static; }
  .out .out-preview { min-height: 100px; max-height: 35vh; }
  .item { padding: 10px 12px; }
  .count { margin-left: 0; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>千枝物語改進清單（100 項）</h1>
    <p class="lead">重點：輝達共用伺服器忙碌時的等待重試、避免中斷、操作體驗、系統穩定性。勾選要製作的項目，按下方「複製已勾選」貼回對話即可。</p>
    <p class="legend">影響：高／中／低。工作量：小（半天內）／中（1 到 2 天）／大（3 天以上）。「優先推薦」＝影響高且工作量小。勾選狀態自動存在這台電腦的瀏覽器。</p>
  </header>

  <div class="bar">
    <div class="row">
      <input type="search" id="q" placeholder="搜尋標題、說明、檔名" aria-label="搜尋">
      <select id="f-impact" aria-label="影響篩選">
        <option value="">全部影響</option><option>高</option><option>中</option><option>低</option>
      </select>
      <select id="f-effort" aria-label="工作量篩選">
        <option value="">全部工作量</option><option>小</option><option>中</option><option>大</option>
      </select>
      <select id="f-scope" aria-label="版本篩選">
        <option value="">全部版本</option><option>兩者</option><option>瀏覽器版</option><option>伺服器版</option>
      </select>
    </div>
    <div class="row" id="cats"></div>
    <div class="row">
      <button class="chip" id="only-picked">只看推薦</button>
      <button class="chip" id="only-checked">只看已勾選</button>
      <button id="check-visible">勾選目前顯示的</button>
      <button id="uncheck-visible">取消目前顯示的</button>
      <button id="clear-all">全部清除</button>
      <span class="count" id="count"></span>
    </div>
  </div>

  <main id="list"></main>
</div>

<div class="out">
  <div class="wrap">
    <div class="row">
      <textarea id="note" placeholder="補充說明（選填）：例如優先順序、哪幾項想合併、等待上限想設幾分鐘" aria-label="補充說明"></textarea>
    </div>
    <div class="row">
      <button class="primary" id="copy">複製已勾選</button>
      <button id="toggle-preview">顯示文字</button>
      <span class="msg" id="msg" role="status" aria-live="polite"></span>
    </div>
    <textarea class="out-preview" id="preview" readonly aria-label="已勾選文字"></textarea>
  </div>
</div>

<script>

  G: '遊玩操作體驗',
  H: '設定與引導',
  I: '行動裝置與無障礙',

const KEY = 'chienzhi.improvements.checked';
const isPick = (it) => it[5] === '高' && it[6] === '小';
let checked = new Set();
try {
  const raw = localStorage.getItem(KEY);
  if (raw) checked = new Set(JSON.parse(raw));
} catch (e) { console.warn('勾選狀態讀取失敗，改用空白清單', e); }

function save() {
  try { localStorage.setItem(KEY, JSON.stringify([...checked])); }
  catch (e) { console.warn('勾選狀態儲存失敗（只影響重新整理後是否保留）', e); }
}

const $ = (s) => document.querySelector(s);
const state = { cat: '', onlyPicked: false, onlyChecked: false };
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const lvl = (v) => (v === '高' || v === '大' ? 'hi' : v === '中' ? 'mid' : 'lo');

function renderCats() {
  const box = $('#cats');
  const all = [['', `全部分類（${ITEMS.length}）`], ...Object.entries(CATS).map(([k, v]) =>
    [k, `${k} ${v}（${ITEMS.filter((it) => it[0][0] === k).length}）`])];
  box.innerHTML = all.map(([k, label]) =>
    `<button class="chip${state.cat === k ? ' on' : ''}" data-cat="${k}">${esc(label)}</button>`).join('');
}

function visible() {
  const q = $('#q').value.trim().toLowerCase();
  const fi = $('#f-impact').value, fe = $('#f-effort').value, fs = $('#f-scope').value;
  return ITEMS.filter((it) =>
    (!state.cat || it[0][0] === state.cat) &&
    (!fi || it[5] === fi) && (!fe || it[6] === fe) && (!fs || it[7] === fs) &&
    (!state.onlyPicked || isPick(it)) && (!state.onlyChecked || checked.has(it[0])) &&
    (!q || it.slice(0, 5).join(' ').toLowerCase().includes(q)));
}

function render() {
  const list = visible();
  const groups = {};
  for (const it of list) (groups[it[0][0]] ||= []).push(it);
  const html = Object.keys(CATS).filter((k) => groups[k]).map((k) => {
    const n = ITEMS.filter((it) => it[0][0] === k && checked.has(it[0])).length;
    return `<h2 class="cat-title">${k}. ${esc(CATS[k])}<small>已勾選 ${n}</small></h2>` +
      groups[k].map((it) => {
        const [id, title, now, fix, files, impact, effort, scope] = it;
        const on = checked.has(id);
        return `<label class="item${on ? ' checked' : ''}" data-id="${id}">
  <input type="checkbox" ${on ? 'checked' : ''} aria-label="${id} ${esc(title)}">
  <div>
    <div class="head"><span class="id">${id}</span><span class="title">${esc(title)}</span></div>
    <div class="tags">
      ${isPick(it) ? '<span class="tag pick">優先推薦</span>' : ''}
      <span class="tag ${lvl(impact)}">影響 ${impact}</span>
      <span class="tag ${lvl(effort)}">工作量 ${effort}</span>
      <span class="tag">${scope}</span>
    </div>
  </div>
  <div class="desc">
    <p><b>現況：</b>${esc(now)}</p>
    <p><b>做法：</b>${esc(fix)}</p>
    <p class="files">${esc(files)}</p>
  </div>
</label>`;
      }).join('');
  }).join('');
  $('#list').innerHTML = html || '<p class="empty">沒有符合條件的項目</p>';
  $('#count').textContent = `已勾選 ${checked.size} / ${ITEMS.length}（顯示 ${list.length} 項）`;
  $('#only-picked').classList.toggle('on', state.onlyPicked);
  $('#only-checked').classList.toggle('on', state.onlyChecked);
  updatePreview();
}

function outputText() {
  const picked = ITEMS.filter((it) => checked.has(it[0]));
  if (!picked.length) return '';
  const lines = [`千枝物語改進清單，已勾選 ${picked.length} / ${ITEMS.length} 項：`];
  for (const [k, name] of Object.entries(CATS)) {
    const rows = picked.filter((it) => it[0][0] === k);
    if (!rows.length) continue;
    lines.push('', `【${k} ${name}】`);
    for (const it of rows) lines.push(`${it[0]} ${it[1]}`);
  }
  const note = $('#note').value.trim();
  if (note) lines.push('', `補充說明：${note}`);
  return lines.join('\n');
}

function updatePreview() { $('#preview').value = outputText(); }

function flash(text) {
  $('#msg').textContent = text;
  clearTimeout(flash.t);
  flash.t = setTimeout(() => { $('#msg').textContent = ''; }, 4000);
}

async function copy() {
  const text = outputText();
  if (!text) { flash('還沒有勾選任何項目'); return; }
  try {
    await navigator.clipboard.writeText(text);
    flash(`已複製 ${checked.size} 項，貼回對話即可`);
  } catch (e) {
    // Clipboard API can be blocked on file:// pages; fall back to selecting the visible text box
    const box = $('#preview');
    box.classList.add('show');
    $('#toggle-preview').textContent = '隱藏文字';
    box.focus();
    box.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (err) { console.warn('複製失敗', err); }
    flash(ok ? `已複製 ${checked.size} 項，貼回對話即可` : '無法自動複製，請在下方文字框按 Ctrl+C');
  }
}

document.addEventListener('change', (e) => {
  const item = e.target.closest('.item');
  if (!item || e.target.type !== 'checkbox') return;
  const id = item.dataset.id;
  if (e.target.checked) checked.add(id); else checked.delete(id);
  save();
  render();
});
$('#cats').addEventListener('click', (e) => {
  const b = e.target.closest('[data-cat]');
  if (!b) return;
  state.cat = b.dataset.cat;
  renderCats();
  render();
});
['#q', '#f-impact', '#f-effort', '#f-scope'].forEach((s) => $(s).addEventListener('input', render));
$('#only-picked').onclick = () => { state.onlyPicked = !state.onlyPicked; render(); };
$('#only-checked').onclick = () => { state.onlyChecked = !state.onlyChecked; render(); };
$('#check-visible').onclick = () => { visible().forEach((it) => checked.add(it[0])); save(); render(); };
$('#uncheck-visible').onclick = () => { visible().forEach((it) => checked.delete(it[0])); save(); render(); };
$('#clear-all').onclick = () => {
  if (!checked.size || !confirm(`確定清除全部 ${checked.size} 項勾選？`)) return;
  checked.clear();
  save();
  render();
};
$('#note').addEventListener('input', updatePreview);
$('#copy').onclick = copy;
$('#toggle-preview').onclick = () => {
  const show = $('#preview').classList.toggle('show');
  $('#toggle-preview').textContent = show ? '隱藏文字' : '顯示文字';
};

renderCats();
render();
</script>
</body>
</html>
