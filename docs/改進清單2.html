<style>
:root {
  --bg: #f6f5f2; --card: #ffffff; --text: #1f1d1a; --muted: #6b665e; --line: #e2ded6;

  --chip: #efece6; --chip-on: #2f6f5e; --chip-on-text: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161714; --card: #1f201c; --text: #ebe8e1; --muted: #a39e94; --line: #34352f;
    --accent: #6cc0a5; --accent-soft: #1f3530; --warn: #e0b14f; --warn-soft: #332b1a;
    --chip: #2a2b26; --chip-on: #6cc0a5; --chip-on-text: #10201b;
  }
}
:root[data-theme="dark"] {
  --bg: #161714; --card: #1f201c; --text: #ebe8e1; --muted: #a39e94; --line: #34352f;
  --accent: #6cc0a5; --accent-soft: #1f3530; --warn: #e0b14f; --warn-soft: #332b1a;
  --chip: #2a2b26; --chip-on: #6cc0a5; --chip-on-text: #10201b;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.6 "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
}
.wrap { max-width: 980px; margin: 0 auto; padding: 0 16px 80px; }
header { padding: 28px 0 8px; }
h1 { font-size: 24px; margin: 0 0 6px; }
.lead { color: var(--muted); margin: 0 0 4px; }
.lead a { color: var(--accent); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin: 14px 0 4px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.stat b { display: block; font-size: 22px; color: var(--accent); font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--muted); }
.bar { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 10px 0; border-bottom: 1px solid var(--line); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 6px 0; }
input[type="search"] {
  font: inherit; color: var(--text); background: var(--card); flex: 1 1 220px; min-width: 0;
  border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px;
}
button {
  font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid transparent;
  background: var(--chip); color: var(--text); padding: 5px 10px; font-size: 13px;
}
button.on { background: var(--chip-on); color: var(--chip-on-text); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.count { font-weight: 600; color: var(--accent); margin-left: auto; white-space: nowrap; }
h2 { font-size: 17px; margin: 26px 0 8px; display: flex; gap: 8px; align-items: baseline; }
h2 small { color: var(--muted); font-weight: 400; font-size: 13px; }
.item { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin: 8px 0; }
.head { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; }
.id { font-family: ui-monospace, Consolas, monospace; color: var(--muted); font-size: 13px; }
.title { font-weight: 600; }
.tag { font-size: 12px; padding: 1px 8px; border-radius: 99px; background: var(--chip); color: var(--muted); }
.tag.test { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.tag.read { background: var(--warn-soft); color: var(--warn); }
.desc { font-size: 14px; margin-top: 4px; }
.desc p { margin: 3px 0; }
.desc b { color: var(--muted); font-weight: 600; }
code, .files { font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; word-break: break-all; }
code { background: var(--chip); padding: 0 4px; border-radius: 4px; }
.files { color: var(--muted); }
.empty { text-align: center; color: var(--muted); padding: 40px 0; }
.note { font-size: 13px; color: var(--muted); }
</style>
</head>

<div class="wrap">
<header>

  <p class="lead">2026-10-31 完成，接續 <a href="改進清單.html">第一輪 100 項清單</a>。分五區各 40 項，加上 L41 到 L44（伺服器解析器修正同步到瀏覽器版），全部已實作；每項都註明實際的驗證方式。</p>

  <div class="stats" id="stats"></div>
</header>

  <div class="row" id="checks" role="group" aria-label="驗證方式"></div>

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const rich = (s) => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>');
const AREA = Object.fromEntries(DATA.areas);
const tested = (it) => it.check.includes('自動測試');
const CHECKS = [['all', '全部'], ['test', '有自動測試'], ['read', '只讀確認']];
const state = { area: 'all', check: 'all', q: '' };

function stats() {
  const n = DATA.items.length, t = DATA.items.filter(tested).length;
  const cards = [[n, '項已實作'], [t, '項有自動測試'], [n - t, '項只讀確認'], [DATA.extras.length, '項額外完成']];
  $('#stats').innerHTML = cards.map(([v, l]) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`).join('');
}

function chips() {
  const areas = [['all', '全部區域'], ...DATA.areas.map(([k, v]) => [k, `${k} ${v}`])];
  $('#areas').innerHTML = areas.map(([k, v]) =>
    `<button data-area="${k}" aria-pressed="${state.area === k}" class="${state.area === k ? 'on' : ''}">${esc(v)}</button>`).join('');
  $('#checks').innerHTML = CHECKS.map(([k, v]) =>
    `<button data-check="${k}" aria-pressed="${state.check === k}" class="${state.check === k ? 'on' : ''}">${v}</button>`).join('');
}

function visible() {
  const q = state.q.trim().toLowerCase();
  return DATA.items.filter((it) =>
    (state.area === 'all' || it.area === state.area) &&
    (state.check === 'all' || (state.check === 'test') === tested(it)) &&
    (!q || Object.values(it).join(' ').toLowerCase().includes(q)));
}

function card(it) {
  const tag = tested(it) ? '<span class="tag test">有自動測試</span>' : '<span class="tag read">只讀確認</span>';
  return `<article class="item"><div class="head"><span class="id">${esc(it.id)}</span>` +
    `<span class="title">${rich(it.title)}</span><span class="tag">${esc(it.cat)}</span>${tag}</div>` +
    `<div class="desc"><p><b>原本：</b>${rich(it.before)}</p><p><b>改動：</b>${rich(it.change)}</p>` +
    `<p class="files">${rich(it.files)}</p><p class="note"><b>驗證：</b>${rich(it.check)}</p></div></article>`;
}

function render() {
  const list = visible();
  $('#count').textContent = `顯示 ${list.length} / ${DATA.items.length}`;
  if (!list.length) { $('#list').innerHTML = '<p class="empty">沒有符合的項目</p>'; return; }
  $('#list').innerHTML = DATA.areas.map(([k, v]) => {
    const group = list.filter((it) => it.area === k);
    return group.length ? `<h2>${k}. ${esc(v)}<small>${group.length} 項</small></h2>${group.map(card).join('')}` : '';
  }).join('');
}

function extras() {
  if (!DATA.extras.length) return;
  $('#extra').innerHTML = `<h2>另外完成<small>不計入 200 項</small></h2>` + DATA.extras.map((x) =>
    `<article class="item"><div class="head"><span class="id">${x.area}</span><span class="title">${rich(x.title)}</span></div>` +
    `<div class="desc"><p><b>改動：</b>${rich(x.change)}</p><p class="files">${rich(x.files)}</p>` +
    `<p class="note"><b>驗證：</b>${rich(x.check)}</p></div></article>`).join('');
}

$('#areas').addEventListener('click', (e) => { const b = e.target.closest('[data-area]'); if (b) { state.area = b.dataset.area; chips(); render(); } });
$('#checks').addEventListener('click', (e) => { const b = e.target.closest('[data-check]'); if (b) { state.check = b.dataset.check; chips(); render(); } });
$('#q').addEventListener('input', (e) => { state.q = e.target.value; render(); });
stats(); chips(); render(); extras();
</script>
